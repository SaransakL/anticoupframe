<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>#AntiCoup Frame</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            border: 0;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,.08);
        }

        #preview {
            width: 100%;
            max-height: 600px;
            object-fit: contain;
            background: #eee;
            border-radius: 14px;
        }

        .upload-box {
            border: 2px dashed #ccc;
            border-radius: 14px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: .2s;
        }

        .upload-box:hover {
            border-color: #0d6efd;
            background: #f8fbff;
        }

        #downloadBtn {
            display: none;
        }
    </style>
</head>

<body>

<div class="container py-5">
    <div class="row justify-content-center">

        <div class="col-lg-7">

            <div class="card p-4">

                <h3 class="fw-bold mb-1">
                    #AntiCoup Frame
                </h3>

                <p class="text-secondary mb-4">
                    อัปโหลดรูปของคุณ แล้วระบบจะใส่กรอบให้โดยอัตโนมัติ<br>
                    เว็บไซต์โดยนายธนาธาร วัฒนไพศาล
                </p>

                <label class="upload-box mb-4">
                    <input
                        type="file"
                        id="imageInput"
                        accept="image/*"
                        hidden
                    >

                    <div class="fs-1 mb-2">＋</div>

                    <strong>เลือกรูปภาพ</strong>

                    <div class="text-secondary small mt-1">
                        PNG / JPG / WEBP
                    </div>
                </label>

                <canvas id="canvas" class="d-none"></canvas>

                <img
                    id="preview"
                    class="d-none"
                    alt="Preview"
                >

                <button
                    id="downloadBtn"
                    class="btn btn-primary btn-lg w-100 mt-4"
                >
                    ดาวน์โหลดรูป
                </button>

            </div>

        </div>

    </div>
</div>

<script>

    // ==============================
    // กำหนด Overlay ตายตัว
    // ==============================

    const OVERLAY_URL = "overlay.png";


    // ==============================
    // Elements
    // ==============================

    const imageInput = document.getElementById("imageInput");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    const preview = document.getElementById("preview");
    const downloadBtn = document.getElementById("downloadBtn");


    // ==============================
    // โหลด Overlay
    // ==============================

    const overlay = new Image();

    overlay.onload = () => {
        console.log("Overlay loaded");
    };

    overlay.src = OVERLAY_URL;


    // ==============================
    // Upload รูป
    // ==============================

    imageInput.addEventListener("change", function () {

        const file = this.files[0];

        if (!file) return;

        const reader = new FileReader();

        reader.onload = function (event) {

            const userImage = new Image();

            userImage.onload = function () {

                render(userImage);

            };

            userImage.src = event.target.result;

        };

        reader.readAsDataURL(file);

    });


    // ==============================
    // Render
    // ==============================

    function render(userImage) {

        /*
         * Canvas = ขนาดรูปที่อัปโหลด
         * Overlay = ปรับให้เท่ากับ Canvas 100%
         */

        canvas.width = userImage.naturalWidth;
        canvas.height = userImage.naturalHeight;


        // --------------------------
        // วาดรูปผู้ใช้
        // --------------------------

        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        ctx.drawImage(
            userImage,
            0,
            0,
            canvas.width,
            canvas.height
        );


        // --------------------------
        // วาด Overlay
        // ให้เท่ากับรูปพอดี
        // --------------------------

        if (overlay.complete && overlay.naturalWidth > 0) {

            ctx.drawImage(
                overlay,
                0,
                0,
                canvas.width,
                canvas.height
            );

            showResult();

        } else {

            overlay.onload = function () {

                ctx.drawImage(
                    overlay,
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );

                showResult();

            };

        }

    }


    // ==============================
    // แสดงผล
    // ==============================

    function showResult() {

        preview.src = canvas.toDataURL("image/png");

        preview.classList.remove("d-none");

        downloadBtn.style.display = "block";

    }


    // ==============================
    // Download
    // ==============================

    downloadBtn.addEventListener("click", function () {

        const link = document.createElement("a");

        link.download = "overlay-result.png";

        link.href = canvas.toDataURL("image/png");

        link.click();

    });

</script>

</body>
</html>
